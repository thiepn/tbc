name: P0A Preservation Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - p0a-preservation-audit
      - 'p0*'
      - 'pr7*'

permissions:
  contents: read

jobs:
  preservation:
    name: Preserve v4.1.0 surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe persistence implementation markers
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const terms=['indexedDB','sessionStorage','getItem','setItem','removeItem','JSON.stringify','JSON.parse','FileReader','createObjectURL','Blob','download','upload','backup','restore','saveState','loadState','saveData','loadData','theBibleChallenge_'];
          for(const term of terms){
            const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
            const m=[...s.matchAll(re)];
            const first=m[0];
            let sample='';
            if(first){const a=Math.max(0,first.index-100),b=Math.min(s.length,first.index+first[0].length+150);sample=s.slice(a,b).replace(/\s+/g,' ').trim();}
            console.log(`${term}: ${m.length}${sample?` | ${sample}`:''}`);
          }
          NODE
      - name: Run P0A preservation audit
        run: node scripts/p0a-preservation-audit.cjs
