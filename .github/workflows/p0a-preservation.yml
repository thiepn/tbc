name: P0 Preservation Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - p0a-preservation-audit
      - 'p0*'
      - 'pr7*'

permissions:
  contents: read

jobs:
  preservation:
    name: Preserve v4.1.0 core and existing features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run static core-preservation audit
        run: node scripts/p0a-preservation-audit.cjs
        continue-on-error: true

      - name: Run static existing-feature preservation audit
        run: node scripts/p0c-existing-feature-preservation-audit.cjs
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local application
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tbc-p0-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbc-p0-server.log
          exit 1

      - name: Run core runtime preservation probe
        run: node scripts/p0a-runtime-probe.cjs

      - name: Diagnose PR5 Settings routing
        run: node scripts/p0e-settings-diagnostic.cjs

      - name: Run existing-feature browser smoke
        run: node scripts/p0c-browser-smoke.cjs

      - name: Enforce static core-preservation gate
        run: node scripts/p0a-preservation-audit.cjs

      - name: Enforce static existing-feature gate
        run: node scripts/p0c-existing-feature-preservation-audit.cjs
