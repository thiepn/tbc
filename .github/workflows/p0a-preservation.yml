name: P0A Preservation Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - p0a-preservation-audit
      - 'p0*'
      - 'pr7*'

permissions:
  contents: read

jobs:
  preservation:
    name: Preserve v4.1.0 surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run P0A preservation audit
        run: node scripts/p0a-preservation-audit.cjs
