name: P0E Final Preservation Certification (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Historical P0E whole-product preservation gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run P0A–P0D static preservation gates + P0E freeze
        run: node scripts/p0e-final-certification.cjs

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local TBC
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tbc-p0e-server.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbc-p0e-server.log
          exit 1

      - name: Run whole-product browser certification
        run: node scripts/p0e-browser-certification.cjs

      - name: Re-run frozen static gate after browser suite
        run: node scripts/p0e-final-certification.cjs

      - name: Upload regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0e-regression-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
