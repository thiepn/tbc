name: P2A Question Bank Extraction (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-certify:
    name: Historical canonical bank extraction and deterministic audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Preserve P1B production contracts
        run: |
          node scripts/p0a-preservation-audit.cjs
          node scripts/p0c-existing-feature-preservation-audit.cjs
          node scripts/p1b-pr7-activation-audit.cjs
      - name: Extract twice, validate five artifacts and three frozen hashes
        run: npm run audit:p2a
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-question-bank-audit-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
