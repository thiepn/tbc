name: P2B Mechanical Integrity Audit (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-certify:
    name: Historical exhaustive mechanical repair and certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair only mechanically confirmed source defects
        run: node scripts/p2b-question-bank-repair.cjs

      - name: Prove no unrelated monolith changes
        run: node scripts/p2b-preservation-audit.cjs

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start repaired local candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tbc-p2b-server.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbc-p2b-server.log
          exit 1

      - name: Extract repaired canonical bank — pass 1
        run: node scripts/p2a-question-bank-extract-certified.cjs

      - name: P2B exhaustive mechanical audit — pass 1
        run: node scripts/p2b-mechanical-integrity-audit.cjs

      - name: Freeze corrected P2A source/hash baseline
        run: node scripts/p2b-freeze-p2a-baseline.cjs

      - name: P2A deterministic audit against corrected baseline — pass 1
        run: node scripts/p2a-question-bank-audit.cjs

      - name: Extract repaired canonical bank — deterministic repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2a-question-bank-extract-certified.cjs

      - name: P2B exhaustive mechanical audit — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2b-mechanical-integrity-audit.cjs

      - name: P2A deterministic audit — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2a-question-bank-audit.cjs

      - name: Verify deterministic extraction byte-for-byte
        shell: bash
        run: |
          cmp artifacts/p2a/question-bank.json artifacts/p2a-repeat/question-bank.json
          cmp artifacts/p2a/structured-questions.json artifacts/p2a-repeat/structured-questions.json
          cmp artifacts/p2a/question-registry.json artifacts/p2a-repeat/question-registry.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('artifacts/p2a/question-bank-summary.json','utf8'));
          const b=JSON.parse(fs.readFileSync('artifacts/p2a-repeat/question-bank-summary.json','utf8'));
          for(const key of ['canonicalBank','structuredBank','registry']){
            if(a.hashes[key]!==b.hashes[key])throw new Error(`${key} is non-deterministic`);
          }
          console.log('P2B deterministic extraction confirmed.');
          NODE

      - name: Preserve production behavior contracts
        run: |
          node scripts/p0a-preservation-audit.cjs
          node scripts/p0c-existing-feature-preservation-audit.cjs
          node scripts/p1b-pr7-activation-audit.cjs

      - name: Historical phase branch writeback disabled
        run: echo "P27C keeps historical P2B runnable for evidence but does not allow it to mutate repository state."

      - name: Upload P2B audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2b-mechanical-integrity-${{ github.sha }}
          path: |
            artifacts/p2a/
            artifacts/p2a-repeat/
            certification/p2a-question-bank-extraction-baseline.json
          if-no-files-found: warn
          retention-days: 30
