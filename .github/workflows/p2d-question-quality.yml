name: P2D Question Quality & Ambiguity (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-certify:
    name: Historical question quality, ambiguity and distractor certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair only confirmed P2D question-quality defects
        run: node scripts/p2d-question-quality-repair.cjs

      - name: Prove P2D is the only monolith delta from P2C
        run: node scripts/p2d-preservation-audit.cjs

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start P2D candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tbc-p2d-server.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbc-p2d-server.log
          exit 1

      - name: Preserve inherited QB1 leakage gate
        run: node scripts/p2c-qb1-diagnostic.cjs

      - name: Extract quality-corrected canonical bank — pass 1
        run: node scripts/p2a-question-bank-extract-certified.cjs

      - name: Preserve P2B mechanical integrity — pass 1
        run: node scripts/p2b-mechanical-integrity-audit.cjs

      - name: Preserve P2C semantic accuracy — pass 1
        run: node scripts/p2c-semantic-accuracy-audit.cjs

      - name: P2D question-quality audit — pass 1
        run: node scripts/p2d-question-quality-audit.cjs

      - name: Freeze P2D-corrected P2A source and hashes
        run: node scripts/p2d-freeze-p2a-baseline.cjs

      - name: P2A audit against P2D baseline — pass 1
        run: node scripts/p2a-question-bank-audit.cjs

      - name: Preserve P2B/P2C certified-successor contracts
        run: |
          node scripts/p2b-preservation-audit.cjs
          node scripts/p2c-preservation-audit.cjs

      - name: Extract quality-corrected canonical bank — deterministic repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2a-question-bank-extract-certified.cjs

      - name: Preserve P2B mechanical integrity — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2b-mechanical-integrity-audit.cjs

      - name: Preserve P2C semantic accuracy — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2c-semantic-accuracy-audit.cjs

      - name: P2D question-quality audit — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
          P2D_OUT_DIR: artifacts/p2d-repeat
        run: node scripts/p2d-question-quality-audit.cjs

      - name: P2A deterministic audit — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2a-question-bank-audit.cjs

      - name: Verify deterministic extraction byte-for-byte
        shell: bash
        run: |
          cmp artifacts/p2a/question-bank.json artifacts/p2a-repeat/question-bank.json
          cmp artifacts/p2a/structured-questions.json artifacts/p2a-repeat/structured-questions.json
          cmp artifacts/p2a/question-registry.json artifacts/p2a-repeat/question-registry.json
          cmp artifacts/p2d/question-quality-report.json artifacts/p2d-repeat/question-quality-report.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('artifacts/p2a/question-bank-summary.json','utf8'));
          const b=JSON.parse(fs.readFileSync('artifacts/p2a-repeat/question-bank-summary.json','utf8'));
          for(const key of ['canonicalBank','structuredBank','registry']){
            if(a.hashes[key]!==b.hashes[key])throw new Error(`${key} is non-deterministic`);
          }
          console.log('P2D deterministic extraction and quality reporting confirmed.');
          NODE

      - name: Preserve production behavior contracts
        run: |
          node scripts/p0a-preservation-audit.cjs
          node scripts/p0c-existing-feature-preservation-audit.cjs
          node scripts/p1b-pr7-activation-audit.cjs

      - name: Historical phase branch writeback disabled
        run: echo "P27C keeps historical P2D runnable for evidence but does not allow it to mutate repository state."

      - name: Upload P2D audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2d-question-quality-${{ github.sha }}
          path: |
            artifacts/p2a/
            artifacts/p2a-repeat/
            artifacts/p2d/
            artifacts/p2d-repeat/
            certification/p2a-question-bank-extraction-baseline.json
            certification/P2D-QUESTION-QUALITY.md
          if-no-files-found: warn
          retention-days: 30
