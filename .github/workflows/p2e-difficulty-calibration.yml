name: P2E Difficulty Calibration & Tier Integrity

on:
  push:
    branches: [p2e-difficulty-calibration-audit, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-certify:
    name: Difficulty calibration and tier integrity certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve deferred P2C/P2D difficulty calibration
        run: node scripts/p2e-difficulty-calibration-repair.cjs

      - name: Prove P2E is the only monolith delta from P2D
        run: node scripts/p2e-preservation-audit.cjs

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start P2E candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tbc-p2e-server.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbc-p2e-server.log
          exit 1

      - name: Preserve inherited QB1 leakage gate
        run: node scripts/p2c-qb1-diagnostic.cjs

      - name: Extract recalibrated canonical bank — pass 1
        env:
          P2A_EXPECTED_TIERS: '{"Beginner":1338,"Easy":1668,"Standard":1132,"Advanced":1140,"Expert":521}'
        run: node scripts/p2a-question-bank-extract-certified.cjs

      - name: Preserve P2B mechanical integrity — pass 1
        run: node scripts/p2b-mechanical-integrity-audit.cjs

      - name: Preserve P2C semantic accuracy — pass 1
        run: node scripts/p2c-semantic-accuracy-audit.cjs

      - name: Preserve P2D question quality — pass 1
        run: node scripts/p2d-question-quality-audit.cjs

      - name: P2E difficulty calibration audit — pass 1
        run: node scripts/p2e-difficulty-calibration-audit.cjs

      - name: Freeze P2E source, hashes and tier distribution
        run: node scripts/p2e-freeze-p2a-baseline.cjs

      - name: P2A audit against P2E baseline — pass 1
        run: node scripts/p2a-question-bank-audit.cjs

      - name: Preserve P2B/P2C/P2D certified-successor contracts
        run: |
          node scripts/p2b-preservation-audit.cjs
          node scripts/p2c-preservation-audit.cjs
          node scripts/p2d-preservation-audit.cjs

      - name: Extract recalibrated canonical bank — deterministic repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
          P2A_EXPECTED_TIERS: '{"Beginner":1338,"Easy":1668,"Standard":1132,"Advanced":1140,"Expert":521}'
        run: node scripts/p2a-question-bank-extract-certified.cjs

      - name: Preserve P2B mechanical integrity — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2b-mechanical-integrity-audit.cjs

      - name: Preserve P2C semantic accuracy — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2c-semantic-accuracy-audit.cjs

      - name: Preserve P2D question quality — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
          P2D_OUT_DIR: artifacts/p2d-repeat
        run: node scripts/p2d-question-quality-audit.cjs

      - name: P2E difficulty calibration audit — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
          P2E_OUT_DIR: artifacts/p2e-repeat
        run: node scripts/p2e-difficulty-calibration-audit.cjs

      - name: P2A deterministic audit — repeat
        env:
          P2A_OUT_DIR: artifacts/p2a-repeat
        run: node scripts/p2a-question-bank-audit.cjs

      - name: Verify deterministic extraction and calibration byte-for-byte
        shell: bash
        run: |
          cmp artifacts/p2a/question-bank.json artifacts/p2a-repeat/question-bank.json
          cmp artifacts/p2a/structured-questions.json artifacts/p2a-repeat/structured-questions.json
          cmp artifacts/p2a/question-registry.json artifacts/p2a-repeat/question-registry.json
          cmp artifacts/p2e/difficulty-calibration-report.json artifacts/p2e-repeat/difficulty-calibration-report.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('artifacts/p2a/question-bank-summary.json','utf8'));
          const b=JSON.parse(fs.readFileSync('artifacts/p2a-repeat/question-bank-summary.json','utf8'));
          for(const key of ['canonicalBank','structuredBank','registry']){
            if(a.hashes[key]!==b.hashes[key])throw new Error(`${key} is non-deterministic`);
          }
          console.log('P2E deterministic extraction and calibration reporting confirmed.');
          NODE

      - name: Preserve production behavior contracts
        run: |
          node scripts/p0a-preservation-audit.cjs
          node scripts/p0c-existing-feature-preservation-audit.cjs
          node scripts/p1b-pr7-activation-audit.cjs

      - name: Commit calibrated monolith and baseline on P2E branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/p2e-difficulty-calibration-audit'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html certification/p2a-question-bank-extraction-baseline.json
          if git diff --cached --quiet; then
            echo "P2E source/baseline already clean; no CI calibration commit needed."
            exit 0
          fi
          git commit -m "P2E: calibrate deferred difficulty tiers"
          git push origin HEAD:p2e-difficulty-calibration-audit

      - name: Upload P2E audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2e-difficulty-calibration-${{ github.sha }}
          path: |
            artifacts/p2a/
            artifacts/p2a-repeat/
            artifacts/p2d/
            artifacts/p2d-repeat/
            artifacts/p2e/
            artifacts/p2e-repeat/
            certification/p2a-question-bank-extraction-baseline.json
            certification/P2E-DIFFICULTY-CALIBRATION.md
          if-no-files-found: warn
          retention-days: 30
