name: PR6 production copy apply

on:
  push:
    branches:
      - pr6-production-copy-polish
    paths:
      - scripts/apply-pr6-production-copy.py
      - .github/workflows/pr6-copy-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pr6-copy-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR6 polish branch
        uses: actions/checkout@v4
        with:
          ref: pr6-production-copy-polish
          fetch-depth: 2
          persist-credentials: true

      - name: Apply player-facing copy cleanup
        run: python scripts/apply-pr6-production-copy.py

      - name: Verify JavaScript and scope
        shell: bash
        run: |
          node --check assets/pr6-play-learning.js
          git diff --check
          git diff --exit-code -- . ':!assets/pr6-play-learning.js' || {
            echo 'Unexpected files changed by PR6 copy cleanup'
            exit 1
          }

      - name: Commit production copy cleanup
        shell: bash
        run: |
          if git diff --quiet -- assets/pr6-play-learning.js; then
            echo 'PR6 player-facing copy already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pr6-play-learning.js
          git commit -m 'PR6: remove migration jargon from player UI [pr6-copy-applied]'
          git push origin HEAD:pr6-production-copy-polish
