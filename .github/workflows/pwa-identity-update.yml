name: Temporary TBC PWA Identity Update

on:
  push:
    branches: [pwa-upgrade-worker]
    paths:
      - '.github/workflows/pwa-identity-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize reviewed PWA successor identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tbc-product-identity.cjs')
          text = p.read_text(encoding='utf-8')
          old = "const RENDER_REPAIR_SUCCESSOR = '742834e8ce148dcc8c8d8fcfdfa2d7baa7ea5f0f';"
          new = "const RENDER_REPAIR_SUCCESSOR = 'a03d37b0a95c3900a0cb5c21f78ddd8f405e74f5';"
          if text.count(old) != 1:
              raise SystemExit('Expected identity anchor not found exactly once')
          p.write_text(text.replace(old, new), encoding='utf-8')
          print('TBC product identity updated for reviewed PWA index successor')
          PY
      - name: Commit identity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tbc-product-identity.cjs
          git commit -m "Authorize TBC PWA product identity"
          git push origin HEAD:pwa-upgrade-worker
