name: Recovery Stage 0 Preservation

on:
  push:
    branches: [main, 'codex/recovery-stage0']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Complete read-only recovery gate
        run: npm run verify
      - name: Require clean tracked files
        run: |
          git diff --check
          git diff --exit-code
      - name: Upload preservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-stage0-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
