name: Release validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Complete combined release and preservation gate
        run: npm run verify

      - name: Require clean tracked files
        run: |
          git diff --check
          git diff --exit-code

      - name: Certify deployed GitHub Pages release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          P27D_DEPLOYMENT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          P27D_DEPLOYMENT_ATTEMPTS: '30'
          P27D_DEPLOYMENT_RETRY_MS: '10000'
        run: node scripts/p27d-deployment-certification.cjs

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
