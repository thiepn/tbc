<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">The Bible Challenge statistics</title>
  <desc id="desc">500 passages, 2,000 audited questions, all 66 books, and 25 journey stages.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b3c"/>
      <stop offset="1" stop-color="#242c67"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50e0e5"/>
      <stop offset=".5" stop-color="#ffd272"/>
      <stop offset="1" stop-color="#929cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dot{animation:blink 3s ease-in-out infinite}.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="148" rx="28" fill="url(#panel)" stroke="#929cff" stroke-opacity=".22"/>
  <path d="M28 127H1172" stroke="url(#line)" stroke-width="2" opacity=".55"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(150)">
      <circle class="dot" cx="-73" cy="41" r="5" fill="#50e0e5" filter="url(#glow)"/>
      <text x="0" y="68" fill="#fff" font-size="35" font-weight="900">500</text>
      <text x="0" y="96" fill="#aeb9dd" font-size="13" font-weight="700" letter-spacing="2">CURATED PASSAGES</text>
    </g>
    <path d="M300 28v82" stroke="#fff" stroke-opacity=".1"/>
    <g transform="translate(450)">
      <circle class="dot d2" cx="-89" cy="41" r="5" fill="#ffd272" filter="url(#glow)"/>
      <text x="0" y="68" fill="#fff" font-size="35" font-weight="900">2,000</text>
      <text x="0" y="96" fill="#aeb9dd" font-size="13" font-weight="700" letter-spacing="2">AUDITED QUESTIONS</text>
    </g>
    <path d="M600 28v82" stroke="#fff" stroke-opacity=".1"/>
    <g transform="translate(750)">
      <circle class="dot d3" cx="-66" cy="41" r="5" fill="#929cff" filter="url(#glow)"/>
      <text x="0" y="68" fill="#fff" font-size="35" font-weight="900">66</text>
      <text x="0" y="96" fill="#aeb9dd" font-size="13" font-weight="700" letter-spacing="2">BIBLE BOOKS</text>
    </g>
    <path d="M900 28v82" stroke="#fff" stroke-opacity=".1"/>
    <g transform="translate(1050)">
      <circle class="dot d4" cx="-82" cy="41" r="5" fill="#ff8791" filter="url(#glow)"/>
      <text x="0" y="68" fill="#fff" font-size="35" font-weight="900">25</text>
      <text x="0" y="96" fill="#aeb9dd" font-size="13" font-weight="700" letter-spacing="2">JOURNEY STAGES</text>
    </g>
  </g>
</svg>
